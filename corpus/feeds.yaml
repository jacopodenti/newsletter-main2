# Feed RSS CONDIVISI tra tutti gli osservatori (ocx, ai, startup-thinking, futuri).
# Non tocca ../src né ../config/feeds.yaml (quello resta per la produzione).
# Un solo corpus per tutti: aggiungere qui una testata la rende disponibile a ogni
# osservatorio, senza bisogno di ri-scaricare per ciascuno.
#
# Un feed con il campo "disabilitato" è stato verificato irrecuperabile (RSS dismesso,
# blocco WAF persistente, o ridondante con un altro feed già attivo) — non è dimenticato,
# è già stato indagato: il valore riporta causa e data della verifica. fetch_feeds.load_feeds()
# lo esclude prima di tentare il fetch, quindi non compare nel report diagnostico. Se un
# editore riapre l'accesso, basta rimuovere il campo per riattivare la riga.

